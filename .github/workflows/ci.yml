name: Refinement checks

on:
  push:
    branches: [main, 'feat/**', 'chore/**']
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov=mdr --cov=app --cov-report=term-missing
